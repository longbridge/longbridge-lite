[package]
name = "longbridge-lite"
version = "0.5.2"
edition = "2024"
publish = false

[dependencies]
gpui-shell = { git = "https://github.com/longbridge/gpui-kit" }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", default-features = false, features = ["test-support"] }

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

# Every dependency, not a list of the ones that looked hot.
#
# A frame is spent almost entirely inside crates this application does not
# write: GPUI paints it, `taffy` lays it out, `zed-font-kit` shapes the text,
# `resvg` rasterizes the icons, `etagere` packs the atlas. Naming a few of them
# left the rest at `opt-level = 0`, and the ones left out are on the same
# frame: a debug build drew in 40-45 ms against release's 6-15 ms, and moved to
# 19-23 ms once the list stopped being a list.
#
# The cost is a slower first build. It is paid once per dependency version,
# while the frame is paid on every interaction, all day.
[profile.dev.package."*"]
opt-level = 3

# gpui-shell's JS stdlib is LLRT, whose crates still depend on `rquickjs` from
# crates.io. gpui-kit routes that name to a facade over `quickjs-jit` so the
# shell and LLRT share one VM, but a `[patch]` only counts in the root
# manifest, so this one has to be repeated here.
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-kit" }
